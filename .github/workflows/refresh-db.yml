name: Refresh Cert Database

# 每天自动抓取 Seeed 产品认证数据，更新 cert_data.db 并提交回仓库。
# Render 检测到 push 后会自动重新部署 -> 网站的 Excel 导出表随之刷新。
on:
  schedule:
    - cron: "0 18 * * *"      # 每天 UTC 18:00（北京时间次日 02:00）
  workflow_dispatch:           # 也可在 GitHub 仓库 Actions 页面手动触发

permissions:
  contents: write              # 允许自动 commit/push 回仓库（用内置 GITHUB_TOKEN，无需 PAT）

concurrency:
  group: refresh-db
  cancel-in-progress: false    # 不打断正在进行的刷新

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape product pages (incremental)
        run: python scraper.py --workers 2

      - name: Extract cert numbers from PDFs (incremental)
        run: python export.py --extract-pdfs
        continue-on-error: true

      - name: Commit & push updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cert_data.db
          if git diff --cached --quiet; then
            echo "No changes — cert_data.db already up to date."
          else
            git commit -m "chore: auto-refresh cert database ($(date -u +%F))"
            git push
            echo "Pushed updated cert_data.db."
          fi